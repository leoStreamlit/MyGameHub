<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyGameHub</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;padding:40px;min-height:100vh;
    font-family:Arial;color:white;
    background:linear-gradient(135deg,#ff00cc,#b000ff,#0066ff,#001aff);
    background-attachment:fixed
}
h1{font-size:42px;margin-bottom:5px}
h2{margin-top:35px}
h4{font-size:18px;margin-top:0}

.games-header{
    display:flex;justify-content:space-between;align-items:center;
    gap:20px;margin-top:35px;margin-bottom:20px
}
.games-header h2{margin:0}

.sortieren{display:flex;align-items:center;gap:10px}
#sortierung{
    padding:10px 14px;border:0;border-radius:10px;
    background:rgba(255,255,255,.18);color:white;
    cursor:pointer;backdrop-filter:blur(10px)
}
#sortierung option{color:black}

.hinzufuegen{
    padding:12px 20px;border:0;border-radius:10px;
    background:white;color:#6c00ff;font-weight:bold;
    cursor:pointer
}
.hinzufuegen:hover{transform:translateY(-2px)}

#hinzufuegenBereich{
    display:none;margin:20px 0;padding:25px;max-width:500px;
    border-radius:18px;background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.25);
    backdrop-filter:blur(15px)
}
#hinzufuegenBereich.aktiv{display:block}

input{
    width:300px;padding:12px 15px;margin-bottom:10px;
    border:0;border-radius:10px;
    background:rgba(255,255,255,.15);color:white;
    outline:0;font-size:15px
}
input::placeholder{color:rgba(255,255,255,.7)}

#gameliste{
    list-style:none;padding:0;margin:0;
    display:flex;flex-wrap:wrap;gap:20px
}

.game{
    width:300px;min-height:180px;padding:20px;
    border:1px solid rgba(255,255,255,.25);
    border-radius:18px;background:rgba(255,255,255,.12);
    backdrop-filter:blur(15px);
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    transition:.25s
}
.game:hover{
    transform:translateY(-7px) scale(1.02);
    background:rgba(255,255,255,.18)
}

.game-logo{
    display:block;width:55px;height:55px;
    object-fit:contain;border-radius:12px;
    margin-bottom:12px;background:rgba(255,255,255,.15);
    padding:5px
}
.game strong{display:block;font-size:22px;margin-bottom:15px}

.spielen{
    display:inline-block;padding:9px 15px;border-radius:9px;
    background:white;color:#6500ff;
    text-decoration:none;font-weight:bold
}

.loeschen{
    margin-left:8px;padding:9px 12px;border:0;
    border-radius:9px;background:rgba(255,60,60,.2);
    color:#ff7777;cursor:pointer
}
.loeschen:hover{background:#ff4444;color:white}

@media(max-width:700px){
    body{padding:20px}
    .games-header{align-items:flex-start;flex-direction:column}
    .sortieren{width:100%}
    #sortierung{width:100%}
    input{width:100%;max-width:300px}
    .game{width:100%;max-width:350px}
    h1{font-size:32px}
}
</style>
</head>

<body>

<h1>Willkommen bei MyGameHub! 🎮</h1>
<h4>Für alle Online-Gamer – der Browser für DEINE Games!</h4>
<p>All deine Games gemanagt.</p>

<div class="games-header">
    <h2>Meine Games</h2>

    <div class="sortieren">
        <label>Sortieren:</label>
        <select id="sortierung" onchange="sortiereGames()">
            <option value="name-az">Name A–Z</option>
            <option value="name-za">Name Z–A</option>
            <option value="link-az">Link A–Z</option>
            <option value="link-za">Link Z–A</option>
            <option value="neueste">Neueste zuerst</option>
            <option value="aelteste">Älteste zuerst</option>
        </select>
    </div>
</div>

<button class="hinzufuegen" onclick="formularAnzeigen()">
    + Game hinzufügen
</button>

<div id="hinzufuegenBereich">
    <h3>Neues Game hinzufügen</h3>

    <input id="eingabe" placeholder="Game Name">
    <br>
    <input id="eingabeLink" placeholder="Game Link">
    <br><br>

    <button class="hinzufuegen" onclick="gameHinzufuegen()">
        Game speichern
    </button>

    <button class="hinzufuegen" onclick="formularSchliessen()">
        Abbrechen
    </button>
</div>

<ul id="gameliste"></ul>

<script>

let games=JSON.parse(localStorage.getItem("meineGames"))||[];

games.forEach((g,i)=>{
    if(!g.erstellt)g.erstellt=i;
});

function formularAnzeigen(){
    document.getElementById("hinzufuegenBereich").classList.add("aktiv");
}

function formularSchliessen(){
    document.getElementById("hinzufuegenBereich").classList.remove("aktiv");
}

function sortiereGames(){
    let s=document.getElementById("sortierung").value;

    games.sort((a,b)=>{
        if(s==="name-az")return a.name.localeCompare(b.name,"de");
        if(s==="name-za")return b.name.localeCompare(a.name,"de");
        if(s==="link-az")return a.link.localeCompare(b.link);
        if(s==="link-za")return b.link.localeCompare(a.link);
        if(s==="neueste")return b.erstellt-a.erstellt;
        return a.erstellt-b.erstellt;
    });

    zeigeGames();
}

function zeigeGames(){

    const liste=document.getElementById("gameliste");
    liste.innerHTML="";

    games.forEach((game,index)=>{

        const li=document.createElement("li");
        li.className="game";

        li.innerHTML=`
            <img class="game-logo"
            src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(game.link)}&sz=128"
            onerror="this.style.display='none'">

            <strong>${game.name}</strong>

            <a class="spielen"
            href="${game.link}" target="_blank"
            rel="noopener noreferrer">▶ Spielen</a>

            <button class="loeschen"
            onclick="gameLoeschen(${index})">🗑 Löschen</button>
        `;

        liste.appendChild(li);
    });

    localStorage.setItem("meineGames",JSON.stringify(games));
}

function gameHinzufuegen(){

    const name=document.getElementById("eingabe").value.trim();
    let link=document.getElementById("eingabeLink").value.trim();

    if(!name||!link){
        alert("Bitte Game Name und Game Link eingeben!");
        return;
    }

    if(!link.startsWith("http://")&&!link.startsWith("https://"))
        link="https://"+link;

    games.push({
        name:name,
        link:link,
        erstellt:Date.now()
    });

    document.getElementById("eingabe").value="";
    document.getElementById("eingabeLink").value="";

    formularSchliessen();
    zeigeGames();
}

function gameLoeschen(index){
    games.splice(index,1);
    zeigeGames();
}

zeigeGames();

</script>

</body>
</html>
