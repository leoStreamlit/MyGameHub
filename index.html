<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MyGameHub</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;
    padding: 40px;

    font-family: Arial, Helvetica, sans-serif;
    color: white;

    background: linear-gradient(
        135deg,
        #ff00cc,
        #b000ff,
        #0066ff,
        #001aff
    );

    background-attachment: fixed;
}


/* Überschriften */

h1 {
    font-size: 42px;
    margin-bottom: 5px;
}

h2 {
    margin-top: 35px;
}

h4 {
    font-size: 18px;
    margin-top: 0;
}

p {
    color: white;
}


/* Meine Games Überschrift */

.meine-games-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-top: 35px;
    margin-bottom: 20px;
}

.meine-games-header h2 {
    margin: 0;
}


/* Game hinzufügen Bereich */

.hinzufuegen-bereich {
    display: none;

    margin-top: 20px;
    margin-bottom: 25px;

    padding: 25px;

    width: 100%;
    max-width: 500px;

    border-radius: 18px;

    background: rgba(255, 255, 255, 0.12);

    backdrop-filter: blur(15px);

    border: 1px solid rgba(255, 255, 255, 0.25);

    box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.25);
}

.hinzufuegen-bereich.aktiv {
    display: block;
}


/* Eingabefelder */

input {
    width: 100%;
    max-width: 400px;

    padding: 12px 15px;
    margin-bottom: 10px;

    border: none;
    border-radius: 10px;

    background: rgba(255, 255, 255, 0.15);

    color: white;

    outline: none;

    font-size: 15px;

    backdrop-filter: blur(10px);
}

input::placeholder {
    color: rgba(255, 255, 255, 0.7);
}

input:focus {
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.6);
}


/* Buttons */

.hinzufuegen,
.schliessen {
    padding: 12px 20px;

    border: none;
    border-radius: 10px;

    background: white;
    color: #6c00ff;

    font-weight: bold;
    font-size: 15px;

    cursor: pointer;

    transition: 0.2s;
}

.hinzufuegen:hover,
.schliessen:hover {
    transform: translateY(-2px);

    box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.25);
}

.schliessen {
    background: rgba(255, 255, 255, 0.2);
    color: white;

    margin-left: 8px;
}


/* Game Liste */

#gameliste {
    list-style: none;

    padding: 0;
    margin: 0;

    display: flex;
    flex-wrap: wrap;

    justify-content: flex-start;
    align-items: flex-start;

    gap: 20px;
}


/* Game Card */

.game {
    position: relative;

    width: 300px;
    min-height: 180px;

    padding: 20px;

    border: 1px solid rgba(255, 255, 255, 0.25);

    border-radius: 18px;

    background: rgba(255, 255, 255, 0.12);

    backdrop-filter: blur(15px);

    box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.25);

    transition: 0.25s;
}

.game:hover {
    transform: translateY(-7px) scale(1.02);

    background: rgba(255, 255, 255, 0.18);

    box-shadow:
        0 15px 35px rgba(0, 0, 0, 0.35);
}


/* Website Logo */

.game-logo {
    display: block;

    width: 55px;
    height: 55px;

    object-fit: contain;

    border-radius: 12px;

    margin-bottom: 12px;

    background: rgba(255, 255, 255, 0.15);

    padding: 5px;
}


/* Game Name */

.game strong {
    display: block;

    font-size: 22px;

    margin-bottom: 15px;
}


/* Spielen Button */

.spielen {
    display: inline-block;

    padding: 9px 15px;

    border-radius: 9px;

    background: white;

    color: #6500ff;

    text-decoration: none;

    font-weight: bold;

    transition: 0.2s;
}

.spielen:hover {
    transform: scale(1.05);
}


/* Löschen Button */

.loeschen {
    margin-left: 8px;

    padding: 9px 12px;

    border: none;

    border-radius: 9px;

    background: rgba(255, 60, 60, 0.2);

    color: #ff7777;

    cursor: pointer;

    transition: 0.2s;
}

.loeschen:hover {
    background: #ff4444;

    color: white;
}


/* Auf kleinen Bildschirmen */

@media (max-width: 600px) {

    body {
        padding: 20px;
    }

    .game {
        width: 100%;
        max-width: 350px;
    }

    h1 {
        font-size: 32px;
    }

    .meine-games-header {
        align-items: flex-start;
        gap: 15px;
        flex-direction: column;
    }

    .schliessen {
        margin-left: 0;
        margin-top: 8px;
    }
}

</style>


<link
    rel="icon"
    type="image/png"
    href="https://th.bing.com/th/id/OIP.TsS4e-71cU6mdWxddQIokAHaHa?w=206&h=206&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3"
>

</head>


<body>


<h1>Willkommen bei MyGameHub! 🎮</h1>

<h4>
    Für alle Online-Gamer – der Browser für DEINE Games!
</h4>

<p>
    All deine Games gemanagt.
</p>


<!-- Meine Games steht jetzt im Vordergrund -->

<div class="meine-games-header">

    <h2>Meine Games</h2>

    <button
        class="hinzufuegen"
        onclick="formularAnzeigen()"
    >
        + Game hinzufügen
    </button>

</div>


<!-- Game hinzufügen Formular -->

<div
    id="hinzufuegenBereich"
    class="hinzufuegen-bereich"
>

    <h3>Neues Game hinzufügen</h3>

    <input
        type="text"
        id="eingabe"
        placeholder="Game Name"
    >

    <br>

    <input
        type="text"
        id="eingabeLink"
        placeholder="Game Link"
    >

    <br><br>

    <button
        class="hinzufuegen"
        onclick="gameHinzufuegen()"
    >
        Game speichern
    </button>

    <button
        class="schliessen"
        onclick="formularSchliessen()"
    >
        Abbrechen
    </button>

</div>


<!-- Games -->

<ul id="gameliste"></ul>



<script>


/*
    Gespeicherte Games laden
*/

let games =
    JSON.parse(
        localStorage.getItem("meineGames")
    ) || [];



/*
    Formular anzeigen
*/

function formularAnzeigen() {

    document
        .getElementById("hinzufuegenBereich")
        .classList.add("aktiv");

}



/*
    Formular schließen
*/

function formularSchliessen() {

    document
        .getElementById("hinzufuegenBereich")
        .classList.remove("aktiv");

}



/*
    Games anzeigen
*/

function zeigeGames() {

    const liste =
        document.getElementById("gameliste");

    liste.innerHTML = "";


    games.forEach(function(game, index) {

        const li =
            document.createElement("li");

        li.className = "game";


        li.innerHTML = `

            <img
                class="game-logo"
                src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(game.link)}&sz=128"
                alt="${game.name} Logo"
                onerror="this.style.display='none'"
            >

            <strong>
                ${game.name}
            </strong>

            <a
                class="spielen"
                href="${game.link}"
                target="_blank"
                rel="noopener noreferrer"
            >
                ▶ Spielen
            </a>

            <button
                class="loeschen"
                onclick="gameLoeschen(${index})"
            >
                🗑 Löschen
            </button>

        `;


        liste.appendChild(li);

    });

}



/*
    Neues Game hinzufügen
*/

function gameHinzufuegen() {

    const name =
        document
            .getElementById("eingabe")
            .value
            .trim();


    const link =
        document
            .getElementById("eingabeLink")
            .value
            .trim();


    if (name === "" || link === "") {

        alert(
            "Bitte Game Name und Game Link eingeben!"
        );

        return;
    }


    let gameLink = link;


    if (
        !gameLink.startsWith("http://") &&
        !gameLink.startsWith("https://")
    ) {

        gameLink =
            "https://" + gameLink;

    }


    const neuesGame = {

        name: name,

        link: gameLink

    };


    games.push(neuesGame);


    localStorage.setItem(
        "meineGames",
        JSON.stringify(games)
    );


    document
        .getElementById("eingabe")
        .value = "";


    document
        .getElementById("eingabeLink")
        .value = "";


    zeigeGames();


    /*
        Nach dem Speichern
        Formular wieder schließen
    */

    formularSchliessen();

}



/*
    Game löschen
*/

function gameLoeschen(index) {

    games.splice(index, 1);


    localStorage.setItem(
        "meineGames",
        JSON.stringify(games)
    );


    zeigeGames();

}



/*
    Beim Start Games anzeigen
*/

zeigeGames();


</script>


</body>
</html>
