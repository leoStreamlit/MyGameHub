<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MyGameHub</title>

<style>

#gameliste {
    list-style: none;
    padding: 0;
}

.game::before {
    content: "🎮";
    margin-right: 10px;
    font-size: 20px;
}

    .game {
    margin-bottom: 15px;
    padding: 10px;
    border: 1px solid white;
    width: 300px;
    color: white;
}
	html, body {
    margin: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;
    background: linear-gradient(
        90deg,
        #ff00cc,
        #b000ff,
        #0066ff,
        #001aff
    );
    background-attachment: fixed;
}
	p { 
		color: white;
		}
	
	h1 {
		color: white;
		}
		
	h2 {
		color: white;
		}
		
	div {
		color: white;
		}

	h4 {
		color: white;
		}

</style>

<link rel="icon" type="image/png" href="https://th.bing.com/th/id/OIP.TsS4e-71cU6mdWxddQIokAHaHa?w=206&h=206&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3">

</head>

<body>

<h1>Willkommen bei MyGameHub!</h1>

<h4>Für alle online Gamer. der Browser für DEINE Games!</h4>

<p>All deine Games gemanaged.</p>

<h2>Game hinzufügen</h2>

<input type="text" id="eingabe" placeholder="Game Name">

<br>

<input type="text" id="eingabeLink" placeholder="Game Link">

<br><br>

<button onclick="gameHinzufuegen()">Game hinzufügen</button>

<h2>Meine Games</h2>

<ul id="gameliste"></ul>


<script>

    // Gespeicherte Games laden
    let games = JSON.parse(localStorage.getItem("meineGames")) || [];

    // Games anzeigen
    function zeigeGames() {

        const liste = document.getElementById("gameliste");

        // Liste leeren
        liste.innerHTML = "";

        // Alle Games durchgehen
        games.forEach(function(game, index) {

            const li = document.createElement("li");

            li.className = "game";

            li.innerHTML = `
                <strong>${game.name}</strong>
                <br>
                <a href="${game.link}" target="_blank">
                    Spiel öffnen
                </a>
                <button class="loeschen" style="color: red;" onclick="gameLoeschen(${index})">
                    Löschen
                </button>
            `;

            liste.appendChild(li);
        });
    }


    // Neues Game hinzufügen
    function gameHinzufuegen() {

        const name = document.getElementById("eingabe").value.trim();
        const link = document.getElementById("eingabeLink").value.trim();

        if (name === "" || link === "") {
            alert("Bitte Game Name und Game Link eingeben!");
            return;
        }

        // Neues Game erstellen
        const neuesGame = {
            name: name,
            link: link
        };

        // Game zur Liste hinzufügen
        games.push(neuesGame);

        // Games speichern
        localStorage.setItem("meineGames", JSON.stringify(games));

        // Eingabefelder leeren
        document.getElementById("eingabe").value = "";
        document.getElementById("eingabeLink").value = "";

        // Liste aktualisieren
        zeigeGames();
    }


    // Game löschen
    function gameLoeschen(index) {

        games.splice(index, 1);

        localStorage.setItem("meineGames", JSON.stringify(games));

        zeigeGames();
    }


    // Beim Start der Website gespeicherte Games anzeigen
    zeigeGames();

</script>

</body>
</html>
